{% extends "auth/base_auth.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h2 class="acesso-titulo">Entrar</h2>
<p class="text-muted mb-4">Use o e-mail e a senha cadastrados pelo administrador.</p>

{% if erro %}
  <div class="alert alert-danger d-flex gap-2 py-2 small" role="alert"><i class="bi bi-exclamation-circle-fill"></i><span>{{ erro }}</span></div>
{% endif %}

<form method="post" action="{{ url_for('auth.login') }}" novalidate>{{ csrf_campo() }}
  <input type="hidden" name="proximo" value="{{ proximo }}">
  <div class="mb-3">
    <label class="form-label" for="email">E-mail</label>
    <div class="input-group campo-acesso">
      <span class="input-group-text"><i class="bi bi-envelope"></i></span>
      <input type="email" class="form-control" id="email" name="email" value="{{ email }}" autocomplete="username"
             placeholder="seu.nome@contabilizape.com.br" required {{ 'autofocus' if not email }}>
    </div>
  </div>
  <div class="mb-2">
    <div class="d-flex justify-content-between">
      <label class="form-label" for="senha">Senha</label>
      <a class="small" href="{{ url_for('auth.esqueci') }}">Esqueci minha senha</a>
    </div>
    <div class="input-group campo-acesso">
      <span class="input-group-text"><i class="bi bi-lock"></i></span>
      <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password" required {{ 'autofocus' if email }}>
      <button type="button" class="btn btn-olho" data-mostrar-senha="senha" aria-label="Mostrar senha"><i class="bi bi-eye"></i></button>
    </div>
    <div class="aviso-caps small text-warning-emphasis mt-1 d-none"><i class="bi bi-capslock-fill"></i> Caps Lock ativado</div>
  </div>
  <div class="form-check my-3">
    <input class="form-check-input" type="checkbox" name="manter" value="1" id="manter">
    <label class="form-check-label" for="manter">Manter conectado neste computador por 30 dias</label>
  </div>
  <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold" data-carregando="Entrando…">Entrar <i class="bi bi-arrow-right"></i></button>
</form>
{% endblock %}
